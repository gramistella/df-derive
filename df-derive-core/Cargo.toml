[package]
name = "df-derive-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Shared dataframe runtime trait identity for df-derive."
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/df-derive-core"
readme = "../README.md"
keywords = ["polars", "dataframe", "df-derive", "decimal"]
categories = ["data-structures"]

[dependencies]
# The Polars types that the standard library's own types are stored as. The
# types behind a feature of this crate are turned on by that feature.
polars = { workspace = true, features = ["dtype-duration", "dtype-i8", "dtype-i16", "dtype-i128", "dtype-u8", "dtype-u16", "dtype-u128"] }
polars-arrow.workspace = true
rust_decimal = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, optional = true }

[features]
default = ["rust_decimal", "chrono"]
# `Decimal` columns, for any decimal type: `Decimal128Encode` and
# `DecimalBuilder`.
decimal = ["polars/dtype-decimal"]
# `rust_decimal::Decimal` as a field type.
rust_decimal = ["decimal", "dep:rust_decimal"]
# `chrono` dates and times as field types.
chrono = ["dep:chrono", "polars/dtype-date", "polars/dtype-datetime", "polars/dtype-time", "polars/timezones"]
# `Categorical` columns: `CategoricalBuilder` and `CategoricalDisplayBuilder`.
categorical = ["polars/dtype-categorical"]
